#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Kotlin/Wasm tooling
# Kotlin instaluje npm tooling (webpack, yarn) do ~/.kotlin. Yarn 1.x tam pak
# prohledava nadrazene adresare a kdyz najde v home package.json s polem
# "packageManager", odmitne pokracovat (chce Corepack). Drzime proto tooling
# v projektu - build tim funguje bez ohledu na obsah home adresare.
kotlin.user.home=.kotlin-home
